[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lying-machine"
version = "0.0.1"
authors = [
    {name="Machina Ratiocinatrix", email="machina.ratio@gmail.com"},
    {name="Alexander Fedotov", email="alex.fedotov@aol.com"}
]
description = "A machine that lies."
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
]
keywords = ["lying-machine"]
dependencies = [
    "pyyaml == 6.0.3"
]

[project.scripts]
lying-machine = "lying_machine.cli:run"
lie = "lying_machine.cli:run"

[project.urls]
"Homepage" = "https://github.com/lying-machine/lying-machine"

[dependency-groups]
dev = ["pytest>=8.0.0"]